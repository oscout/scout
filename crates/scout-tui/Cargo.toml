[package]
name = "scout-tui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "scout-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
unicode-width = "0.2"
